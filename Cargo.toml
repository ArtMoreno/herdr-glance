[package]
name = "herdr-glance"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
authors = ["ArtMoreno"]
repository = "https://github.com/ArtMoreno/herdr-glance"
description = "A themeable, read-mostly Herdr agent dashboard"
license = "MIT"

[[bin]]
name = "glance"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[profile.release]
strip = true
lto = "thin"
